name: Dispatch builds

# Every push to calliope-main rebuilds the dev builds of the apps that use calliope-ui (the
# editors' build-dev branches, campus-dev), so they run its newest commit without a commit of
# their own. A release rebuilds the live builds as well, from release.yml (its push is made with
# the workflow token and starts no workflow). Which apps: builds.json in
# .github/actions/dispatch-calliope-builds/; the GitHub App for the dispatches: its README.
#
# By hand: gh workflow run dispatch-builds.yml -R calliope-edu/calliope-ui -f channels="dev live"

on:
  push:
    branches: [calliope-main]
  workflow_dispatch:
    inputs:
      channels:
        description: Which builds to start
        type: choice
        options: [dev, live, dev live]
        default: dev

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dispatch-calliope-builds
        with:
          channels: ${{ inputs.channels || 'dev' }}
          app-id: ${{ vars.CALLIOPE_BUILDS_APP_ID }}
          private-key: ${{ secrets.CALLIOPE_BUILDS_APP_KEY }}
